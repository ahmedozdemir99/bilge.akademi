<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0b1f3a" />
    <link rel="icon" href="/icon-192.png" />
    <title>Bilge Akademi’yi paylaş</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0b1f3a; color: #f8f5ed; }
      main { width: min(100% - 2rem, 42rem); margin: 2.5rem auto; }
      h1 { font-family: Georgia, serif; font-size: clamp(1.7rem, 6vw, 2.5rem); margin: 0 0 1rem; }
      img { display: block; width: 100%; height: auto; border: 1px solid #39526b; border-radius: .75rem; }
      .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: .5rem; margin-top: 1rem; }
      button, a.action { display: grid; place-items: center; min-height: 44px; padding: .65rem .8rem; border: 1px solid #637a92; border-radius: .5rem; background: #132c4e; color: #f8f5ed; font: inherit; font-weight: 650; text-align: center; text-decoration: none; cursor: pointer; }
      button.primary { background: #e5b64d; color: #0b1f3a; border-color: #e5b64d; }
      button:disabled { opacity: .65; cursor: wait; }
      :focus-visible { outline: 2px solid #e5b64d; outline-offset: 3px; }
      [hidden] { display: none !important; }
      p { color: #c8d5e7; line-height: 1.5; }
      textarea { display: block; width: 100%; padding: .75rem; background: #132c4e; color: #f8f5ed; border: 1px solid #637a92; border-radius: .5rem; font: inherit; resize: vertical; }
    </style>
    <script type="module" src="./share.js"></script>
  </head>
  <body>
    <main>
      <h1>Bilge Akademi’yi paylaş</h1>
      <img src="/bilge-akademi-paylasim-v1.jpg" width="1200" height="630" alt="Bilge Akademi’nin altın kitap logosu ve kısa tanıtımı" />
      <div class="actions">
        <button id="share" type="button" class="primary" hidden>Görseli paylaş</button>
        <button id="copy" type="button" hidden>Tanıtımı ve bağlantıyı kopyala</button>
        <a class="action" href="/bilge-akademi-paylasim-v1.jpg" download="Bilge-Akademi.jpg">Görseli indir</a>
        <a class="action" href="/paylas/">Bilge Akademi’yi aç</a>
      </div>
      <p id="status" role="status"></p>
      <textarea id="caption" aria-label="Paylaşım açıklaması" readonly rows="4">Bilge Akademi
Etkileşimli ortaokul ve LGS dersleri, testler, öğrenci takibi ve deneme analizi.
https://bilge-akademi4.pages.dev/paylas/</textarea>
    </main>
  </body>
</html>
