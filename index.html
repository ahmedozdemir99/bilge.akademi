  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-teal-600/20 selection:text-teal-900 dark:selection:text-teal-200">
    <section id="app-startup" aria-label="Bilge Akademi" style="box-sizing:border-box;max-width:32rem;margin:12vh auto;padding:1.25rem;font:1rem/1.5 system-ui,sans-serif">
      <h1 style="font-size:1.5rem;margin:0 0 .5rem">Bilge Akademi</h1>
      <p id="app-startup-message" role="status">Uygulama yükleniyor…</p>
      <p><a id="app-startup-retry" href="" hidden style="color:#0b1f3a">Yeniden dene</a></p>
      <noscript>
        <style>#app-startup-message { display: none }</style>
        <p>Uygulamayı açmak için tarayıcınızda JavaScript’i etkinleştirin.</p>
      </noscript>
    </section>
    <div id="root"></div>
    <script>
      (function () {
        var root = document.getElementById('root');
        var startup = document.getElementById('app-startup');
        var message = document.getElementById('app-startup-message');
        var retry = document.getElementById('app-startup-retry');
        function showRecovery() {
          if (root.firstElementChild) return;
          message.textContent = 'Uygulama henüz açılamadı. Bağlantınızı kontrol edip yeniden deneyin.';
          retry.hidden = false;
        }
        var timer = window.setTimeout(showRecovery, 12000);
        window.addEventListener('error', function (event) {
          if (event.error || (event.target.tagName === 'SCRIPT' && event.target.type === 'module')) {
            showRecovery();
          }
        }, true);
        var observer = new MutationObserver(function () {
          if (!root.firstElementChild) return;
          window.clearTimeout(timer);
          observer.disconnect();
          startup.remove();
        });
        observer.observe(root, { childList: true });
        retry.addEventListener('click', function (event) {
          event.preventDefault();
          window.location.reload();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
